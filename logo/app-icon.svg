<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Dark Gradient Background -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#131722"/>
      <stop offset="50%" stop-color="#0b0e14"/>
      <stop offset="100%" stop-color="#05070a"/>
    </linearGradient>

    <!-- Subtle Inner Glow / Border -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Radial Ambient Glow Behind Icon -->
    <radialGradient id="ambient-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#1d4ed8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Icon Mask -->
    <mask id="icon-mask">
      <path fill="#fff" d="M0 0h800v560H0z"/>
      <path stroke="#000" stroke-linejoin="round" stroke-width="14" d="m418 124-52 96h38l-28 86 62-106h-40z"/>
    </mask>
  </defs>

  <!-- macOS Style Rounded Squircle Background -->
  <rect x="16" y="16" width="480" height="480" rx="108" ry="108" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="2"/>

  <!-- Ambient Light Glow behind mark -->
  <circle cx="256" cy="256" r="200" fill="url(#ambient-glow)"/>

  <!-- Centered DevFlow Mark -->
  <g transform="translate(10, 0)">
    <g transform="translate(256, 256) scale(1.5) translate(-406, -216)">
      <g mask="url(#icon-mask)">
        <path fill="none" stroke="#1d4ed8" stroke-linecap="round" stroke-width="12" d="M334 215a72 72 0 1 1 128 39"/>
        <path fill="#1d4ed8" d="m463 240 17 20-28 6z"/>
        <path fill="none" stroke="#2563eb" stroke-dasharray="10 7" stroke-linecap="round" stroke-width="5" d="M444 176a52 52 0 0 0-90 39"/>
      </g>
      <path fill="#00e5ff" stroke="#00e5ff" stroke-width="2" d="m418 126-50 92h38l-28 86 58-102h-38z"/>
    </g>
  </g>
</svg>
