name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'
        type: string
      draft:
        description: 'Create as a draft release'
        required: false
        default: false
        type: boolean
      prerelease:
        description: 'Mark as pre-release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            cli_asset: devflow-cli-macos-arm64.tar.gz
            gui_asset: devflow-gui-macos-arm64.tar.gz
            build_gui: true
          - os: macos-latest
            target: x86_64-apple-darwin
            cli_asset: devflow-cli-macos-x86_64.tar.gz
            gui_asset: devflow-gui-macos-x86_64.tar.gz
            build_gui: true
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            cli_asset: devflow-cli-linux-x86_64.tar.gz
            gui_asset: devflow-gui-linux-x86_64.tar.gz
            build_gui: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            cli_asset: devflow-cli-linux-aarch64.tar.gz
            gui_asset: ''
            build_gui: false

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Node.js (for Desktop Companion GUI)
        if: matrix.build_gui
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Linux GUI Dependencies
        if: matrix.os == 'ubuntu-latest' && matrix.build_gui
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf build-essential libssl-dev libxdo-dev

      - name: Install Cross (Linux arm64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build CLI Binary
        if: matrix.target != 'aarch64-unknown-linux-gnu'
        run: cargo build --release --target ${{ matrix.target }} -p devflow_cli

      - name: Build CLI Binary with Cross (Linux arm64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cross build --release --target ${{ matrix.target }} -p devflow_cli

      - name: Package CLI Binary
        shell: bash
        run: |
          mkdir -p dist
          tar -czf dist/${{ matrix.cli_asset }} -C target/${{ matrix.target }}/release devflow
          shasum -a 256 dist/${{ matrix.cli_asset }} > dist/${{ matrix.cli_asset }}.sha256

      - name: Build Desktop Companion GUI
        if: matrix.build_gui
        shell: bash
        run: |
          cd clients/tauri_app
          npm ci || npm install
          npm run build
          cd ../..
          cargo build --release --target ${{ matrix.target }} --manifest-path clients/tauri_app/src-tauri/Cargo.toml
          mkdir -p dist
          if [[ "${{ matrix.target }}" == *"apple-darwin"* ]]; then
            APP_DIR="DevFlow.app"
            mkdir -p "$APP_DIR/Contents/MacOS" "$APP_DIR/Contents/Resources"
            cp clients/tauri_app/src-tauri/target/${{ matrix.target }}/release/devflow-desktop "$APP_DIR/Contents/MacOS/devflow-gui"
            chmod +x "$APP_DIR/Contents/MacOS/devflow-gui"
            cp clients/tauri_app/src-tauri/icons/icon.icns "$APP_DIR/Contents/Resources/icon.icns" 2>/dev/null || true
            cp clients/tauri_app/src-tauri/icons/icon.png "$APP_DIR/Contents/Resources/icon.png" 2>/dev/null || true
            cat << 'EOF' > "$APP_DIR/Contents/Info.plist"
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
    <key>CFBundleExecutable</key>
    <string>devflow-gui</string>
    <key>CFBundleIconFile</key>
    <string>icon.icns</string>
    <key>CFBundleIdentifier</key>
    <string>com.cmdworks.devflow</string>
    <key>CFBundleName</key>
    <string>DevFlow</string>
    <key>CFBundleDisplayName</key>
    <string>DevFlow</string>
    <key>CFBundlePackageType</key>
    <string>APPL</string>
    <key>CFBundleShortVersionString</key>
    <string>0.1.0</string>
    <key>CFBundleVersion</key>
    <string>1</string>
    <key>LSMinimumSystemVersion</key>
    <string>10.13</string>
    <key>NSHighResolutionCapable</key>
    <true/>
</dict>
</plist>
EOF
            tar -czf dist/${{ matrix.gui_asset }} DevFlow.app
            rm -rf DevFlow.app
          else
            mkdir -p dist/package-linux
            cp clients/tauri_app/src-tauri/target/${{ matrix.target }}/release/devflow-desktop dist/package-linux/devflow-gui
            cp clients/tauri_app/src-tauri/icons/icon.png dist/package-linux/devflow.png 2>/dev/null || true
            tar -czf dist/${{ matrix.gui_asset }} -C dist/package-linux devflow-gui devflow.png
            rm -rf dist/package-linux
          fi
          shasum -a 256 dist/${{ matrix.gui_asset }} > dist/${{ matrix.gui_asset }}.sha256

      - name: Resolve Release Tag
        id: release_tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Upload Release Artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: DevFlow ${{ steps.release_tag.outputs.tag }}
          draft: ${{ github.event.inputs.draft || false }}
          prerelease: ${{ github.event.inputs.prerelease || false }}
          generate_release_notes: true
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-release-docs:
    name: Update Readme for Latest Release
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Resolve Release Tag
        id: release_tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Run Readme Release Updater Script
        shell: bash
        run: |
          chmod +x ./scripts/update-readme-release.sh
          ./scripts/update-readme-release.sh "${{ steps.release_tag.outputs.tag }}"

      - name: Commit and Push Updated Readme
        shell: bash
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/getting-started.md
          if ! git diff --staged --quiet; then
            git commit -m "docs: update README for release ${{ steps.release_tag.outputs.tag }} [skip ci]"
            git push origin main
          else
            echo "Documentation is already up-to-date."
          fi

