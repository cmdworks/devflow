[package]
name = "devflow-desktop"
version = "0.1.0"
description = "DevFlow Desktop Companion App"
edition = "2021"

[workspace]

[dependencies]
devflow_core = { path = "../../../crates/devflow_core" }
devflow_protocol = { path = "../../../crates/devflow_protocol" }
devflow_devices = { path = "../../../crates/devflow_devices" }
devflow_frameworks = { path = "../../../crates/devflow_frameworks" }
devflow_logs = { path = "../../../crates/devflow_logs" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["full"] }
anyhow = "1.0"
axum = "0.8"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
async-stream = "0.3"
futures-util = "0.3"
