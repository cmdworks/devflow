[workspace]
resolver = "2"
members = [
    "crates/devflow_core",
    "crates/devflow_protocol",
    "crates/devflow_devices",
    "crates/devflow_logs",
    "crates/devflow_watcher",
    "crates/devflow_platforms",
    "crates/devflow_frameworks",
    "crates/devflow_mcp",
    "crates/devflow_tui",
    "crates/devflow_cli",
]
exclude = [
    "examples/*",
    "clients/*",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["DevFlow Contributors"]
license = "MIT"
repository = "https://github.com/yourorg/devflow"
description = "Universal, framework-aware development runner and MCP server"

[workspace.dependencies]
devflow_protocol = { path = "crates/devflow_protocol" }
devflow_core = { path = "crates/devflow_core" }
devflow_devices = { path = "crates/devflow_devices" }
devflow_logs = { path = "crates/devflow_logs" }
devflow_watcher = { path = "crates/devflow_watcher" }
devflow_platforms = { path = "crates/devflow_platforms" }
devflow_frameworks = { path = "crates/devflow_frameworks" }
devflow_mcp = { path = "crates/devflow_mcp" }
devflow_tui = { path = "crates/devflow_tui" }

tokio = { version = "1.43", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
clap = { version = "4.5", features = ["derive", "env"] }
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
notify = "8.0"
notify-debouncer-mini = "0.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
thiserror = "2.0"
anyhow = "1.0"
async-trait = "0.1"
futures = "0.3"
axum = "0.8"
tower-http = { version = "0.6", features = ["cors", "trace"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.13", features = ["v4", "serde"] }
colored = "3.0"
regex = "1.11"
shellexpand = "3.1"
